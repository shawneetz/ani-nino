promised: "Proclamation 1520 (November 28, 1975) declared Maragondon and Ternate in Cavite and Nasugbu in Batangas a tourist zone under the Philippine Tourism Authority, to be developed into resort complexes for foreign and domestic visitors."
happened: "The proclamation told the Philippine Tourism Authority to identify areas with tourism value inside the zone and left military reservations out. PD 1574 (June 11, 1978) gave 125 hectares of public land in Ternate to the authority for tourism development. Neither text names farmers, tenants or occupants."
question: "Find a record of tenants or farmers in Maragondon and Ternate before 1986, such as a court decision, a survey or a study."
