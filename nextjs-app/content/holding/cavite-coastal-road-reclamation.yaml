promised: "The national government was reclaiming foreshore and offshore areas of Manila Bay from the Cultural Center through Parañaque, Las Piñas and Bacoor up to Cavite City. PD 1085 (February 4, 1977) said it was in the public interest to turn the land into a modern city."
happened: "PD 1085 gave the reclaimed land to the Public Estates Authority and kept the rights of the Construction and Development Corporation of the Philippines under a November 20, 1973 contract. The decree names no fishermen, fish farms or families. A 2024 report says reclamation at Island Cove in Kawit began as early as the 1970s and has drawn controversy over fishers' livelihood."
question: "Find a 1970s count of fisherfolk or farm families affected in Bacoor and Kawit, from a government record or a study."
