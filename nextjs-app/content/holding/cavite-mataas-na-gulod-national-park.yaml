promised: "Proclamation 1594 (October 26, 1976) withdrew Mts. Palaypalay and Mataas na Gulod and vicinities from settlement, entry, sale, lease and exploitation, subject to private rights, as a national park, game refuge and bird sanctuary of about 4,000 hectares."
happened: "The text names Ternate and Maragondon in Cavite and Nasugbu in Batangas, and puts the park under the Bureau of Forest Development. It bans hunting and the destruction of vegetation. It names no occupants, farmers or tenants. What it meant for people farming or living there before 1986 has not been found."
