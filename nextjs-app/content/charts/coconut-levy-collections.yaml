# "nationwide" moved from the labels into the notes until the scope chip lands in c4
id: coconut-levy-collections
title: Coconut levy collected
caveat: These are two reports of roughly the same nationwide total. They are not two amounts to add together. Collection figures say nothing about how the money was spent. Quezon was believed to be the biggest contributor, but no Quezon-only figure was found. The Inquirer article behind the second report adds that critics put the total much higher.
description: Amounts collected from coconut farmers through the levy, as two reports of roughly the same total.
unit: million pesos
points:
  - label: "Report 1: 1973 to 1983"
    value: 9695
    qualifier: exact
    note: "Nationwide figure from the PCGG, as reported by the Inquirer."
    source:
      title: Quezon governor backs Marcos, but wants assurance coco levy fund will be returned to farmers
      publisher: Philippine Daily Inquirer
      voice: independent
      cite: "Reports the PCGG figure."
      url: "https://newsinfo.inquirer.net/1572455/quezon-governor-backs-marcos-but-wants-assurance-coco-levy-fund-will-be-returned-to-farmers/amp"
      accessed: "2026-11-05"
  - label: "Report 2: nine years of the levy"
    value: 9600
    qualifier: approx
    note: "Nationwide figure. A state audit found about 9.6 billion pesos collected over the nine years the copra tax was enforced."
    source:
      title: "Coco levy 'biggest joke to hit century'"
      publisher: Philippine Daily Inquirer
      voice: independent
      cite: "First of two parts. Reports the state audit figure; the article adds that critics put the total much higher."
      url: "https://newsinfo.inquirer.net/779990/coco-levy-biggest-joke-to-hit-century"
