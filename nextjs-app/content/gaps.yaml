# what this file does: lists research gaps shown on the sources page
# a gap is something a reader could wrongly assume the site covers, a program question stays on its page
# each "program" must match a live program slug, a gap that points at a held slug fails content:check
# change in this version (b1): removed the laiban gap, its program moved to content/holding
# change in this version (b8): kept seven gaps, added region-scope, reworded cavite-not-covered without a count
# removed because they repeat a program question: fishpen permits, laguna coalition lead (now in the coconut levy question),
# uplb displacement numbers, makiling resettlement outcomes
# change in this version (p3): the laguna land transfer gap names the 1987 calamba thesis as a second unread lead
# change in this version (n6): cavite-not-covered now matches the real coverage, still no count in the text
#   the id stays the same because /sources#gap-cavite-not-covered is linked from other pages
- id: no-farmer-interviews
  kind: method
  title: No interviews with farmers from the martial-law era
  description: This project relies on documents, reports and studies. No farmers from the period were interviewed, so their own accounts are missing.
- id: links-are-interpretation
  kind: method
  title: Connections between past and present are interpretation
  description: Links between a martial-law program and later events are the author's reading, not established findings.
- id: cavite-not-covered
  kind: scope
  title: Cavite coverage is partial
  description: Cavite pages exist, but not every one is confirmed. Some are still being checked because no source counts the families affected or their income. Other Cavite topics are held back because their texts name no farmers or fisherfolk.
- id: region-scope
  kind: scope
  title: Region IV was wider than CALABARZON
  description: In the martial-law years, Region IV (Southern Tagalog) also held Mindoro, Marinduque, Romblon and Palawan. A regional figure from that time is not a CALABARZON figure, and this site does not use one as a local number.
- id: laguna-land-transfer-numbers
  kind: data_missing
  title: No Laguna figures for land actually transferred
  description: National counts were found (210,054 certificates by January 1976). Laguna counts of tenants covered, certificates issued and titles awarded have not been found. Two UPLB theses are unread leads. One is a 1991 study of land ownership in Calamba and Los Baños. The other is a 1987 study of Calamba tenant-farmers under leasehold; its full text is not in the UPLB repository.
  program: laguna-operation-land-transfer
- id: coconut-levy-flow
  kind: unverified
  title: Where the coconut levy money went
  description: A national total was found (9.695 billion pesos, 1973 to 1983). How much came from Quezon and what returned to Quezon farmers has not been checked.
  program: quezon-coconut-levy
- id: masagana-repayment-conflict
  kind: unverified
  title: Masagana 99 repayment figures disagree
  description: Sources give different repayment rates (94 percent falling to 68 percent in one table, 93.3 falling to 45.8 in another, about 90 falling to 35 in a third). The measures and dates need to be compared against the original studies.
  program: laguna-masagana-99
- id: hacienda-yulo-coverage
  kind: unverified
  title: Whether Hacienda Yulo was ever covered by PD 27
  description: Only advocacy sources say the estate was exempt. A DAR or court record is needed. The Yulo hacienda in Floridablanca, Pampanga is a different estate.
  program: laguna-hacienda-yulo
