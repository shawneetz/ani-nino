# What this file does: program page for Nasugbu sugar estates, which PD 27 left out.
# Hacienda Looc and the Roxas haciendas (Palico, Banilad, Caylaway) are two different properties.
# It stays "still checking" because nothing was found on what happened to sugar tenants before 1986.
slug: batangas-nasugbu-sugar-estates
title: Sugar estates in Nasugbu and PD 27
when: 1972 onward
