promised: "Presidential Decree 27 covered tenants on private rice and corn lands."
happened: "Presidential Decree 27 left out sugar, copra and other export-crop lands, so tenants on sugar estates in Nasugbu fell outside it. On November 28, 1975, Proclamation 1520 declared parts of Nasugbu and the Cavite towns of Maragondon and Ternate a tourism zone. Roxas and Co. later cited it to seek conversion of its three Nasugbu haciendas (Palico, Banilad and Caylaway); the Supreme Court's 2009 decision describes this. Hacienda Looc is a separate 8,650-hectare property. The Department of Agrarian Reform (DAR) issued 25 Certificates of Land Ownership Award (CLOAs) for 3,981 hectares there in 1991 to 1993. What land reform reached Nasugbu sugar tenants before 1986 is still being checked."
question: "Find a DAR record, court record or independent study on tenants of Roxas and Co. sugar lands in Nasugbu from 1972 to 1986."
