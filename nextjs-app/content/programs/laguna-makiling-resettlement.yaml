promised: "Proclamation 1540 (April 12, 1976) reserved 760 hectares of public land in Sampaloc, Quezon for resettlement. Executive Order 494 (January 6, 1978) created a Makiling Kainginero Resettlement Committee chaired by UPLB to plan and run it."
happened: "The order told the committee to clear the resettlement area of trees, except those needed for riverbank protection. Money from the harvested timber went to the area's development, with UPLB as trustee. The area was cut out of the timber concession of the International Hardwood and Veneer Company of the Philippines. How many families were moved, and what became of them, has not been found."
question: "Find the number of kainginero families resettled, and any account from the settlers or UPLB."
