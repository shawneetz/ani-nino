promised: "PD 457 (May 15, 1974) let UPLB buy or expropriate private farms to expand research for UPLB and IRRI, with funds and resettlement for tenant-tillers and landless occupants who chose homelots."
happened: "PD 729 (June 5, 1975) created the Institute of Plant Breeding at UPLB. LOI 905 (March 28, 1979) allowed more acquisitions by sale or expropriation. It also funded resettlement sites in Bay and Los Baños for dispossessed tenant-tillers and landless workers, to be built as Bagong Lipunan Sites and Services projects with homelot titles. PD 457's schedule of owners includes Luis A. Yulo; I could not tell whether those parcels were in Laguna. How many families were displaced, and what they received, is not yet known."
question: "Find the number of families displaced, the resettlement sites actually built, and any UPLB or tenant account."
