promised: "Presidential Decree (PD) 457 (May 15, 1974) let the University of the Philippines Los Baños (UPLB) buy or expropriate private farms to expand research for UPLB and the International Rice Research Institute, with funds and resettlement for tenant-tillers and landless occupants who chose homelots."
happened: "Presidential Decree 729 (June 5, 1975) created the Institute of Plant Breeding at UPLB. Letter of Instructions 905 (March 28, 1979) allowed more acquisitions by sale or expropriation. It also funded resettlement sites in Bay and Los Baños for dispossessed tenant-tillers and landless workers, to be built as Bagong Lipunan Sites and Services projects with homelot titles. PD 457's schedule of owners includes Luis A. Yulo; it is not known whether those parcels were in Laguna. How many families were displaced, and what they received, is not yet known."
question: "Find the number of families displaced, the resettlement sites actually built, and any UPLB or tenant account."
