promised: A certificate was meant to be the first step toward owning the land a tenant farmed.
happened: A certificate was a paper step, not a land title. Government figures say certificates went to 12,000 farmers by April 1973 and 210,054 tenants by January 1976, against a goal of 914,914 tenants. These are national figures. Whether Laguna tenants went on to receive titles is still being checked.
question: Find the source of the national figures, how many Laguna certificates became Emancipation Patents or titles, and when certificates started in Laguna.
