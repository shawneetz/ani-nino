promised: "A certificate was meant to be the first step toward owning the land a tenant farmed. It showed the tenant as an amortizing owner and could be used to borrow."
happened: "Operation Land Transfer began issuing certificates in November 1972. Under PD 315 of October 22, 1973, banks had to accept a registered certificate as collateral for loans. A certificate was still not a title: the Emancipation Patent came after payment and other requirements. The Martial Law Museum article says a tenant first had to join a Samahang Nayon to get a certificate. Nationwide, 210,054 tenants held certificates by January 1976. How many Laguna certificates became patents is still being checked."
question: "How many Laguna certificates became Emancipation Patents or titles? Look for DAR Region IV records or a study. A 1991 UPLB thesis on landownership and land use change in Calamba and Los Baños (Patindol) is a lead I have not read: https://www.ukdr.uplb.edu.ph/etd-grad/3826"
