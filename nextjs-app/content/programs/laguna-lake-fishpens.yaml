promised: "The Laguna Lake Development Authority (LLDA) was given wider powers over the lake so it could be developed for fish, water and other uses. In 1984 the government said its policy was to democratize the lake's benefits by giving marginal users a chance to own, manage and run fishpens."
happened: "LLDA set up its first pilot fishpen at Looc, Cardona, Rizal, around 1970 to 1971. A survey counted 993 pens covering 4,802 hectares by 1973. FAO figures show pen area growing from 40 hectares in 1971 to about 30,000 hectares by 1983. A United Nations University review says the early, uncontrolled pens clashed with small fishermen, who said the pens cut their fishing area. It adds that all of the rise in the lake's revenue from 1968 to 1973 went to pen owners. On October 9, 1978 a presidential directive ordered unpermitted fishpens destroyed and new permits suspended. Letter of Instructions 769 (November 16, 1978) set the rules for removing or restructuring pens. Letter of Instructions 1399 (April 11, 1984) ordered excess pen areas turned over to small fishermen's cooperatives, up to 30 hectares each. Who held the 1970s permits is not yet known."
