promised: "A national livelihood program of loans and training for small village enterprises, set up as a priority program by Executive Order 715 (August 6, 1981) and run through the Ministry of Human Settlements."
happened: "Loans and releases were to be guaranteed by a KKK Capital Fund held at the Central Bank. The Martial Law Museum article says an August 1981 Central Bank circular directed one-fourth of the Barrio Savings Fund, which Samahang Nayon farmers paid into, to KKK. That claim still needs checking against the circular. Which Laguna projects were funded, and who received the loans, has not been found."
question: "Find a list of Laguna KKK projects, the Central Bank circular on the Barrio Savings Fund, and a study of repayment and who received loans."
