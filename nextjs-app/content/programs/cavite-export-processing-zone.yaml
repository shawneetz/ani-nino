promised: "Proclamation 1980 (May 30, 1980) set aside private land in Rosario and General Trias for the Export Processing Zone Authority, subject to private rights. Proclamation 2017 (September 19, 1980) added 55 hectares in Rosario."
happened: "A 2005 proclamation says farmers were displaced by the proclamation and development of the Cavite zone. Proclamation 1980 reserved lots of the San Francisco de Malabon Estate in Rosario and General Trias, and Proclamation 2017 added 55 hectares in Rosario. The lot lists name no farmers. The number of farmers displaced, and when they left, has not been found."
