# what this file does: program page for the cavite export processing zone in rosario and general trias
# status is confirmed: all three sources are government texts, opened and checked on 2026-11-26
# the lot lists in proclamations 1980 and 2017 name no farmers, so the page says so
# the proclamation 1980 text prints its area as 2,208,898 hectares, which looks like a typo, so no area is quoted for it
