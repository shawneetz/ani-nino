promised: "Each barrio would form a Samahang Nayon, an association of small farmers meant to pool savings, credit and marketing. PD 175 (April 14, 1973) created the system, and LOI 23 (July 9, 1973) set the rules."
happened: "Members had to finish pre-membership training, pledge improved farming and savings, and pay fees. A Barrio Guarantee Fund guaranteed the land payments of members under PD 27. PD 27's text says no title is issued until the tenant is a full member of a recognized cooperative. The Martial Law Museum article goes further and says membership came before even the certificate. It also says some farmers avoided joining because of the money obligations. Region IV (Southern Tagalog) had 1,365 associations with 60,043 members in 1974 and 1,879 with 86,535 members in 1979. These are regional figures, not Laguna-only counts."
question: "Find Laguna counts of associations and members. The SEARCA and UPLBCA Pila Social Laboratory study (1973 to 1974) is a lead I have not verified."
