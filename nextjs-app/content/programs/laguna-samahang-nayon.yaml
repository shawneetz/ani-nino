promised: "Each barrio would form a Samahang Nayon, an association of small farmers meant to pool savings, credit and marketing. Letter of Implementation 23 (July 9, 1973) set the rules, implementing Presidential Decree (PD) 175 (April 14, 1973)."
happened: "Members of a Samahang Nayon farmers' association had to finish pre-membership training, pledge improved farming and savings, and pay fees. A Barrio Guarantee Fund guaranteed the land payments of members under PD 27. PD 27's text says no title is issued until the tenant is a full member of a recognized cooperative. The Martial Law Museum article goes further and says membership came before even the certificate. It also says some farmers avoided joining because of the money obligations. The article counts associations by region number only, and no Laguna figure has been found."
