promised: "PD 276 (August 20, 1973) set a levy of 15 pesos per 100 kilos of copra on every first sale. It fed a Coconut Consumers Stabilization Fund to subsidize coconut-based consumer goods. Later decrees (PD 961 and PD 1468) said the funds were owned by coconut farmers."
happened: "Farmers paid the levy when they sold copra, from 1973 to 1982, and at one point it reached 100 pesos per 100 kilos. Inquirer reports say Quezon farmers were believed to be the biggest contributors. The PCGG said 9.695 billion pesos was collected from 1973 to 1983. Where the money went, and what Quezon farmers got back, is still being checked."
question: "Find how much was collected in Quezon alone (PCA or COA records). Also check the 2021 coco levy trust fund law (RA 11524), which is in your notes but which I did not verify."
