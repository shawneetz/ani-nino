promised: "Dams on the Kaliwa River were planned to supply water to Metro Manila. In the 1979 and 2015 studies only the Laiban plan had hydropower."
happened: "The Manila Water Supply III project, later called the Laiban Dam, was conceived in 1979 under Marcos, and the Inquirer says planning for a Laiban Dam in Tanay began that year. A Mongabay report says abuses and civil unrest halted construction. NEDA approved a smaller Kaliwa dam only in 2014. Its site lies in ancestral domain titled to the Dumagat-Remontado. What the plans meant for Dumagat communities before 1986 is still being checked."
question: "Confirm what happened between 1979 and 1986 (the PCIJ Laiban Dam chronology, July 2009, is a lead I could not open), and find sources on what the plans meant for Dumagat communities."
