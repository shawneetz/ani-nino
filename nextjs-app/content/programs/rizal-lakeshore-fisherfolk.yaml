promised: "The Laguna Lake Development Authority was given wider powers over the lake so it could be developed for fish, water and other uses."
happened: "LLDA built its first pilot fishpen at Looc, Cardona, around 1970 to 1971, so the Rizal shore is where the pens began. A 2017 Inquirer report says the lake's fish farming began in the early 1970s with businessmen, mostly from Malabon and Rizal. How the pens affected small fisherfolk in Binangonan, Cardona and Morong is still being checked."
question: "Find accounts or records from Binangonan, Cardona or Morong about fishpens and small fisherfolk. Two leads I have not read: a 1981 UP thesis on the Biyayang Dagat credit program (https://selib.upd.edu.ph/etdir/items/25e1c415-707d-495e-a9af-0b2bf30cc703) and a 1988 UPLB thesis on fishermen-borrowers under the DBP-LLDA financing program (https://www.ukdr.uplb.edu.ph/etd-undergrad/3148)."
