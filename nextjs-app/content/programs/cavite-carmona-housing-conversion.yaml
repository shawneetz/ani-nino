# what this file does: program page for farmland in carmona that was converted to a housing project
# it stays "still checking" because one court decision is the only source, and the farmers' tenancy was disputed
# stage N5 (2026-11-27): the decision was opened in full and every sentence below matches it
# the decision says the land was untenanted in 1979, the farmers say they tilled it since 1961, the text keeps both
# a later decision (G.R. No. 131481) cites this one, so it is not an independent check
# no 1970s tenancy record was found, the question asks for one
slug: cavite-carmona-housing-conversion
title: Farm tillers and a housing project in Carmona
when: 1976 onward
topic: displacement
status: checking
