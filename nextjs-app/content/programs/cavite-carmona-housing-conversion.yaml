promised: "Carmona's council approved a low-cost housing project on May 30, 1976. A July 3, 1979 order of the Minister of Agrarian Reform allowed 35.8 hectares to become a residential subdivision."
happened: "A 2004 Supreme Court decision ordered 37 farmers' association members to leave land in Carmona, Cavite, after finding they were not tenants. The owner, Credito Asiatic (earlier Lakeview Development Corporation), built a housing project there. The 1979 order found the converted 35.8 hectares untenanted and not planted to rice or corn. The members say they have farmed there since 1961. A group of farmers who sued in 1987 said they learned of the conversion only that January. The decision's notes say the barrio is now part of General Mariano Alvarez."
question: "Find a 1970s Ministry of Agrarian Reform or Carmona record that shows who tilled the land, and whether anyone paid rent to the owner."
