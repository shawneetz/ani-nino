title: Operation Land Transfer in Laguna
when: 1972 onward
topic: land
status: confirmed
startYear: 1972
endYear: null
# Calamba and Biñan were two of the nine pilot towns. Pins are town centers, so they are approximate.
places:
  - { name: Calamba, province: laguna, lat: 14.2117, lng: 121.1653, approximate: true }
  - { name: Biñan, province: laguna, lat: 14.3333, lng: 121.0833, approximate: true }
promised: "PD 27 declared tenant-farmers of private rice and corn lands the owners of the land they till as of October 21, 1972. The land was to be paid for over 15 years at 6 percent a year, and title would come only after payment and membership in a farmers' cooperative."
happened: "Operation Land Transfer started in November 1972. Nine towns in six provinces were chosen as pilot areas, including Calamba and Biñan in Laguna. A government magazine reported that by January 31, 1976, 210,054 tenants across the country held certificates of land transfer. Its 53 percent figure matches a revised target of 393,778 tenants, set after landholdings of seven hectares and below were left out; the original target was 914,914 (see the Charts page). A certificate was not a title: an Emancipation Patent came later, after payment and other requirements. An article published by the Martial Law Museum says the decree reached less than 14 percent of all cultivated land, because it left out sugar, coconut and other export crops. Laguna-only counts of tenants, certificates and titles have not been found."
