promised: PD 27 declared tenant-farmers of private rice and corn lands owners of the land they till.
happened: Calamba and Biñan were among nine pilot towns in six provinces from November 1972 to 1973. The first targets were estates of 100 hectares and above, widening to 24 hectares and above from Oct 3, 1973. How many Laguna tenants actually received land is still being checked.
question: Find Laguna figures for tenants covered, certificates issued and titles actually awarded, from DAR records or a study.
