promised: "Loans, seed, fertilizer and chemicals for farmers who adopted high-yielding rice, aiming at 99 cavans of palay per hectare, up from about 40."
happened: "Masagana 99 began on May 21, 1973. The government tapped academics and scientists, many from UPLB, to design and run it. Nationally, about 400,000 farmers borrowed in the first phase (May to October 1973) and about 530,000 in the third (May to October 1974). By the 14th phase (November 1979 to April 1980) only 54,250 borrowed. Repayment fell as well; the Charts page shows the table figures, and sources disagree on exact rates. National Scientist Emil Javier, as reported by Rappler, put the share of small rice farmers who could borrow at 3.7 percent by 1980. The program stopped in 1984. Laguna-only loan and repayment figures have not been found."
question: "Find Laguna loan and repayment figures from rural banks, PNB or the Agricultural Credit Administration, and a study of how Laguna farmers experienced the program."
